global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 4000
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 30s
    timeout queue 1m
    timeout connect 10s
    timeout client 1h
    timeout server 1h
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000
    load-server-state-from-file global
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    # Discovery clients never need unrelated host containers. Restrict list
    # snapshots to this Compose project and its managed runner prefix. Keep the
    # event label broad for upgrade compatibility; every resulting refresh is
    # still resolved through the platform-scoped list snapshot.
    acl containers_list path -m reg -i ^(/v[\d\.]+)?/containers/json$
    acl container_events path -m reg -i ^(/v[\d\.]+)?/events$
    http-request set-query all=1&filters=%%7B%%22label%%22%%3A%%7B%%22traefik.enable%%3Dtrue%%22%%3Atrue%%7D%%2C%%22name%%22%%3A%%7B%%22devpush%%22%%3Atrue%%2C%%22runner-%%22%%3Atrue%%7D%%7D if METH_GET containers_list
    http-request set-query filters=%%7B%%22type%%22%%3A%%7B%%22container%%22%%3Atrue%%7D%%2C%%22label%%22%%3A%%7B%%22traefik.enable%%3Dtrue%%22%%3Atrue%%7D%%7D if METH_GET container_events

    # Discovery and lifecycle metadata used by Traefik, Alloy, and workers.
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/(_ping|version|info|events)$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs)$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/images/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/images/.+/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/networks(?:/[a-zA-Z0-9_.-]+)?$ }

    # Runtime operations. Docker builds are deliberately absent: only the
    # isolated rootless BuildKit daemon may execute repository build steps.
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/create$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|kill)$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/images/create$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/images/load$ }
    http-request allow if METH_DELETE { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+$ }
    http-request allow if METH_DELETE { path,url_dec -m reg -i ^(/v[\d\.]+)?/images/.+$ }

    http-request deny
    default_backend dockerbackend
