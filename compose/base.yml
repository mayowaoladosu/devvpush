services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        APP_UID: ${SERVICE_UID:-1000}
        APP_GID: ${SERVICE_GID:-1000}
    entrypoint: /entrypoint.app.sh
    restart: always
    depends_on:
      - redis
      - pgsql
    networks:
      - default
      - internal
    env_file:
      - ${DATA_DIR:-../data}/.env
    environment:
      HOST_DATA_DIR: ${DATA_DIR:-../data}
      SERVICE_UID: ${SERVICE_UID}
      SERVICE_GID: ${SERVICE_GID}
    volumes:
      - ${DATA_DIR:-../data}:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${APP_HOSTNAME}`)"
      - "traefik.http.routers.app.service=app@docker"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
      - "traefik.docker.network=devpush_default"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-jobs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        APP_UID: ${SERVICE_UID:-1000}
        APP_GID: ${SERVICE_GID:-1000}
    entrypoint: /entrypoint.worker-jobs.sh
    restart: always
    stop_grace_period: ${JOB_TIMEOUT_SECONDS:-320}s
    depends_on:
      redis:
        condition: service_started
      pgsql:
        condition: service_started
      buildkitd:
        condition: service_healthy
    networks:
      - default
      - internal
      - runner
    env_file:
      - ${DATA_DIR:-../data}/.env
    environment:
      HOST_DATA_DIR: ${DATA_DIR:-../data}
      SERVICE_UID: ${SERVICE_UID}
      SERVICE_GID: ${SERVICE_GID}
      BUILDKIT_PROXY_URL: "http://${BUILDKIT_PROXY_IP:-10.250.0.2}:3128"
    group_add:
      - "1000"
    volumes:
      - ${DATA_DIR:-../data}:/data
      - buildkit-socket:/run/buildkit:ro
    healthcheck:
      test:
        ["CMD", "uv", "run", "arq", "--check", "workers.jobs.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
      args:
        APP_UID: ${SERVICE_UID:-1000}
        APP_GID: ${SERVICE_GID:-1000}
    entrypoint: /entrypoint.worker-monitor.sh
    restart: always
    depends_on:
      - redis
      - pgsql
    networks:
      - default
      - internal
      - runner
    env_file:
      - ${DATA_DIR:-../data}/.env
    environment:
      HOST_DATA_DIR: ${DATA_DIR:-../data}
      SERVICE_UID: ${SERVICE_UID}
      SERVICE_GID: ${SERVICE_GID}
    volumes:
      - ${DATA_DIR:-../data}:/data

  redis:
    image: redis:alpine
    restart: always
    networks:
      - internal

  docker-proxy:
    image: tecnativa/docker-socket-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DIR:-..}/docker/docker-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    environment:
      - DISABLE_IPV6=1
    networks:
      - internal

  buildkit-volume-init:
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o 1000 -g 1000 -m 0700 /state
        install -d -o 1000 -g 1000 -m 0750 /socket
        chown 1000:1000 /state /socket
        if [ -S /socket/buildkitd.sock ] && \
           ! buildctl --addr unix:///socket/buildkitd.sock debug workers >/dev/null 2>&1; then
          rm -f /socket/buildkitd.sock
        fi
    read_only: true
    restart: "no"
    volumes:
      - buildkit-state:/state
      - buildkit-socket:/socket

  buildkitd:
    image: moby/buildkit:v0.26.2-rootless@sha256:0ffa2fcf6b8757c47d569b3ef0f03f9d5eb3b9ff5ce68d858f994f89b749da0c
    restart: unless-stopped
    depends_on:
      buildkit-volume-init:
        condition: service_completed_successfully
      buildkit-egress:
        condition: service_healthy
    command:
      - --addr
      - unix:///run/user/1000/buildkit/buildkitd.sock
      - --oci-worker-snapshotter=native
      - --oci-worker-gc
      - --oci-worker-gc-keepstorage
      - ${BUILDKIT_CACHE_GC_STORAGE:-2048,10240,20480}
    networks:
      - buildkit
    environment:
      HTTP_PROXY: http://buildkit-egress:3128
      HTTPS_PROXY: http://buildkit-egress:3128
      http_proxy: http://buildkit-egress:3128
      https_proxy: http://buildkit-egress:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    read_only: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    mem_limit: ${BUILDKIT_MEMORY_LIMIT:-4g}
    cpus: ${BUILDKIT_CPUS:-4.0}
    pids_limit: ${BUILDKIT_PIDS_LIMIT:-2048}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=268435456,uid=1000,gid=1000
      - /home/user/.local/tmp:rw,nosuid,nodev,noexec,size=67108864,uid=1000,gid=1000
      - /run/user/1000:rw,nosuid,nodev,noexec,size=16777216,uid=1000,gid=1000
    volumes:
      - buildkit-state:/home/user/.local/share/buildkit
      - buildkit-socket:/run/user/1000/buildkit
    healthcheck:
      test: ["CMD", "/usr/bin/buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s

  buildkit-egress:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    user: "13:13"
    entrypoint: ["/usr/sbin/squid"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    restart: unless-stopped
    networks:
      buildkit:
        ipv4_address: ${BUILDKIT_PROXY_IP:-10.250.0.2}
      buildkit-egress: {}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=16777216,uid=13,gid=13
      - /tmp:rw,nosuid,nodev,noexec,size=16777216,uid=13,gid=13
    volumes:
      - ${APP_DIR:-..}/docker/squid-buildkit.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/squid.pid && kill -0 $$(cat /run/squid.pid)"]
      interval: 30s
      start_interval: 2s
      timeout: 2s
      retries: 3
      start_period: 30s

  traefik:
    image: traefik:v3.6.2
    restart: always
    depends_on:
      - docker-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://docker-proxy:2375"
      - "--providers.docker.watch=true"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    networks:
      - default
      - internal
      - runner
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deployment-not-found.rule=HostRegexp(`^(.+)\\.${DEPLOY_DOMAIN}$`)"
      - "traefik.http.routers.deployment-not-found.entrypoints=web"
      - "traefik.http.routers.deployment-not-found.priority=1"
      - "traefik.http.routers.deployment-not-found.service=noop@internal"
      - "traefik.http.routers.deployment-not-found.middlewares=deployment-redirect"
      - "traefik.http.middlewares.deployment-redirect.redirectRegex.regex=^https?://([^/]+)"
      - "traefik.http.middlewares.deployment-redirect.redirectRegex.permanent=false"

  pgsql:
    image: postgres:16
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      POSTGRES_DB: ${POSTGRES_DB:-devpush}
      POSTGRES_USER: ${POSTGRES_USER:-devpush-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - devpush-db:/var/lib/postgresql/data

  loki:
    image: grafana/loki:3.5.8
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - default
      - internal
    volumes:
      - loki-data:/loki
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  alloy:
    image: grafana/alloy:v1.11.3
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    restart: unless-stopped
    depends_on:
      - docker-proxy
      - loki
    networks:
      - default
      - internal
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${APP_DIR:-..}/docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy

volumes:
  devpush-db:
  loki-data:
  alloy-data:
  buildkit-state:
  buildkit-socket:

networks:
  default:
    name: devpush_default
  internal:
    name: devpush_internal
    internal: true
  runner:
    name: devpush_runner
  buildkit:
    name: "${DEVPUSH_VOLUME_PREFIX:-devpush}_buildkit"
    internal: true
    ipam:
      config:
        - subnet: ${BUILDKIT_INTERNAL_SUBNET:-10.250.0.0/24}
  buildkit-egress:
    name: "${DEVPUSH_VOLUME_PREFIX:-devpush}_buildkit-egress"
